<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>A&M Solution</title>
    <script>
      // GitHub Pages has no server-side router, so a direct visit or refresh
      // on a route like /proyecto-brotes hits this 404 page. We stash the
      // requested URL and redirect to "/", where index.html's inline script
      // restores it before the React app (and its router) mounts.
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0; URL='/'" />
  </head>
  <body></body>
</html>
